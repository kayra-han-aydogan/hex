<!DOCTYPE html>
<!-- kayralrics.com -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="kayralrics.com">
<meta name="description" content="Encode and decode text and images in any base. kayralrics.com">
<title>Base | kayralrics.com</title>
<style>
/* kayralrics.com */
:root{--bg:#000;--text:#ebe6e6;--mute:#8b8081;--line:#2b1b1d;--red:#e0182d;--red2:#ff4458;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:560px;margin:0 auto;padding:28px 22px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
.mark{color:var(--text);font-weight:400;letter-spacing:.02em}
.mark i{font-style:normal;color:var(--red)}
h1{margin:56px 0 6px;font-size:clamp(52px,16vw,76px);font-weight:200;letter-spacing:-.02em;line-height:1}
h1::after{content:"";display:block;width:44px;height:1px;background:var(--red);margin-top:22px}
.sub{margin:18px 0 40px;color:var(--mute);font-size:16px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:30px}
.tabs.s{border-bottom:0;margin:-12px 0 28px;gap:22px}
.tabs button{position:relative;background:none;border:0;padding:0 0 12px;color:var(--mute);font:inherit;font-size:17px;cursor:pointer;transition:color .2s}
.tabs.s button{font-size:15px;padding-bottom:6px}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--red);transform:scaleX(0);transition:transform .25s}
.tabs button.on{color:var(--text)}
.tabs button.on::after{transform:scaleX(1)}
label{display:block;margin:0 0 8px;font-size:14px;color:var(--mute)}
textarea,input[type=text],select{width:100%;background:transparent;border:1px solid var(--line);border-radius:2px;color:var(--text);font:inherit;font-size:16px;padding:13px 14px;outline:0;transition:border-color .2s}
textarea{resize:vertical;min-height:132px;line-height:1.55}
textarea:focus,select:focus{border-color:var(--red)}
select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:40px}
option{background:#000;color:var(--text)}
.sel{position:relative}
.sel::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:1px solid var(--mute);border-bottom:1px solid var(--mute);transform:translateY(-70%) rotate(45deg);pointer-events:none}
#out{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--red2);word-break:break-all}
::placeholder{color:#4d4344}
.field{margin-bottom:24px}
.drop{display:flex;align-items:center;gap:14px;min-height:96px;margin:0;padding:14px;border:1px dashed var(--line);border-radius:2px;color:var(--mute);font-size:16px;cursor:pointer;transition:border-color .2s}
.drop:hover,.drop.over{border-color:var(--red)}
.drop img{width:64px;height:64px;object-fit:cover;border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:10px;margin:-8px 0 24px;font-size:14px;color:var(--mute);cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:15px;height:15px;margin:0;border:1px solid var(--line);border-radius:2px;background:transparent;cursor:pointer;transition:background .2s,border-color .2s}
.chk input:checked{background:var(--red);border-color:var(--red)}
.go{position:relative;overflow:hidden;width:100%;height:52px;background:transparent;border:1px solid var(--red);border-radius:2px;color:var(--text);font:inherit;font-size:17px;font-weight:400;letter-spacing:.04em;cursor:pointer;transition:background .2s}
.go span{position:relative;z-index:1}
.go::before{content:"";position:absolute;inset:0;background:var(--red);transform:scaleX(0);transform-origin:left}
.go:hover{background:rgba(224,24,45,.14)}
.go:disabled{cursor:progress}
.go.busy::before{animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{0%{transform:scaleX(0);transform-origin:left}49%{transform:scaleX(1);transform-origin:left}51%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
#msg{min-height:22px;margin:14px 0 0;font-size:14px;color:var(--mute)}
#msg.err{color:var(--red2)}
#res{margin-top:26px}
.rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rh label{margin:0}
.rh button{background:none;border:0;padding:0;margin-left:18px;color:var(--mute);font:inherit;font-size:14px;cursor:pointer}
.rh button:hover{color:var(--red2)}
#pv img{display:block;max-width:100%;max-height:440px;margin:0 auto;border:1px solid var(--line)}
#pv p{margin:12px 0 0;font-size:13px;color:var(--mute);text-align:center}
footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
footer b{font-weight:400;color:var(--text)}
button:focus-visible,.drop:focus-within{outline:1px solid var(--red2);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.go.busy::before{animation:none;transform:scaleX(1)}}
</style>
</head>
<body>
<main>
<header><span class="mark">kayralrics<i>.</i>com</span><span>Base</span></header>
<h1>Base</h1>
<p class="sub">Encode and decode text and images in any base.</p>
<nav class="tabs" id="kind" role="tablist">
<button type="button" class="on" data-v="t" role="tab" aria-selected="true">Text</button>
<button type="button" data-v="i" role="tab" aria-selected="false">Image</button>
</nav>
<nav class="tabs s" id="dir" role="tablist">
<button type="button" class="on" data-v="e" role="tab" aria-selected="true">Encode</button>
<button type="button" data-v="d" role="tab" aria-selected="false">Decode</button>
</nav>
<div class="field">
<label for="base">Base</label>
<div class="sel"><select id="base">
<option value="b64">Base64</option>
<option value="b64u">Base64 URL</option>
<option value="b32">Base32</option>
<option value="b32h">Base32 Hex</option>
<option value="b16">Base16 (Hex)</option>
<option value="b85">Base85 (Ascii85)</option>
<option value="b58">Base58</option>
<option value="b62">Base62</option>
<option value="b36">Base36</option>
<option value="b10">Base10 (Decimal)</option>
<option value="b8">Base8 (Octal)</option>
<option value="b2">Base2 (Binary)</option>
</select></div>
</div>
<div class="field" id="tf">
<label for="in" id="l1">Text to encode</label>
<textarea id="in" spellcheck="false" placeholder="Type or paste your text"></textarea>
</div>
<div class="field" id="ff" hidden>
<label for="file">Image</label>
<label class="drop" id="drop" for="file"><img id="th" alt="" hidden><span id="fname">Choose or drop an image</span></label>
<input type="file" id="file" accept="image/*" hidden>
</div>
<label class="chk" id="uri" hidden><input type="checkbox" id="duri">Add data URI prefix</label>
<button type="button" class="go" id="go"><span id="gl">Encode</span></button>
<p id="msg" role="status" aria-live="polite"></p>
<section id="res" hidden>
<div class="rh"><label for="out" id="rl">Result</label><span><button type="button" id="cp">Copy</button><button type="button" id="sw">Swap</button><button type="button" id="clr">Clear</button></span></div>
<textarea id="out" readonly spellcheck="false"></textarea>
<div id="pv" hidden><img id="img" alt="Decoded image"><p>Press and hold or right-click the image to save it.</p></div>
</section>
<footer><b>kayralrics.com</b></footer>
</main>
<script>
/* kayralrics.com */
(()=>{
const $=s=>document.querySelector(s);
const te=new TextEncoder(),td=new TextDecoder(),tf8=new TextDecoder('utf-8',{fatal:true});
const base=$('#base'),inp=$('#in'),out=$('#out'),res=$('#res'),msg=$('#msg'),go=$('#go'),pv=$('#pv'),img=$('#img'),th=$('#th'),fname=$('#fname');
let k='t',d='e',file=null,url='';
const say=(t,e)=>{msg.textContent=t;msg.className=e?'err':''};
const hx=u=>Array.from(u,x=>x.toString(16).padStart(2,'0')).join('');
const unhx=s=>{s=s.replace(/\s+/g,'').replace(/^0x/i,'');if(s.length%2||/[^0-9a-f]/i.test(s))throw 0;const o=new Uint8Array(s.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(s.substr(i*2,2),16);return o};
const per=(r,w)=>({e:u=>Array.from(u,x=>x.toString(r).padStart(w,'0')).join(' '),d:s=>{
const p=r===10?s.split(/[\s,]+/).filter(Boolean):(s=s.replace(/\s+/g,''),s.length%w?[NaN]:s.match(new RegExp('.{'+w+'}','g'))||[]);
const ok={2:/^[01]+$/,8:/^[0-7]+$/,10:/^\d+$/}[r];
return Uint8Array.from(p,t=>{if(!ok.test(t))throw 0;const v=parseInt(t,r);if(v>255)throw 0;return v});
}});
const e64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const d64=s=>Uint8Array.from(atob(s.replace(/\s+/g,'')),c=>c.charCodeAt(0));
const A32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',A32H='0123456789ABCDEFGHIJKLMNOPQRSTUV',A36='0123456789abcdefghijklmnopqrstuvwxyz',A58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz',A62='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
const e32=(u,a)=>{let o='',bits=0,v=0;for(const x of u){v=(v<<8)|x;bits+=8;while(bits>=5){o+=a[(v>>>(bits-5))&31];bits-=5}v&=(1<<bits)-1}if(bits)o+=a[(v<<(5-bits))&31];while(o.length%8)o+='=';return o};
const d32=(s,a)=>{s=s.replace(/\s+/g,'').toUpperCase().replace(/=+$/,'');let bits=0,v=0;const o=[];for(const c of s){const i=a.indexOf(c);if(i<0)throw 0;v=(v<<5)|i;bits+=5;if(bits>=8){o.push((v>>>(bits-8))&255);bits-=8;v&=(1<<bits)-1}}return Uint8Array.from(o)};
const e85=u=>{let o='';for(let i=0;i<u.length;i+=4){const n=Math.min(4,u.length-i);let v=0;for(let j=0;j<4;j++)v=v*256+(j<n?u[i+j]:0);const c=[];for(let j=0;j<5;j++){c.unshift(String.fromCharCode(33+v%85));v=Math.floor(v/85)}o+=c.slice(0,n+1).join('')}return o};
const d85=s=>{s=s.replace(/\s+/g,'').replace(/^<~|~>$/g,'');const o=[];for(let i=0;i<s.length;i+=5){const n=Math.min(5,s.length-i);if(n<2)throw 0;let v=0;for(let j=0;j<5;j++){const c=j<n?s.charCodeAt(i+j)-33:84;if(c<0||c>84)throw 0;v=v*85+c}for(let j=0;j<n-1;j++)o.push(Math.floor(v/2**(24-8*j))%256)}return Uint8Array.from(o)};
const big=a=>{
const B=BigInt(a.length),K=10,BK=B**10n;
return{
e:u=>{let z=0;while(z<u.length&&!u[z])z++;let n=u.length>z?BigInt('0x'+hx(u.subarray(z))):0n;const r=[];
while(n>0n){let c=n%BK;n/=BK;for(let i=0;i<K;i++){r.push(a[Number(c%B)]);c/=B}}
while(r.length&&r[r.length-1]===a[0])r.pop();
return a[0].repeat(z)+r.reverse().join('')},
d:s=>{s=s.replace(/\s+/g,'');if(a===A36)s=s.toLowerCase();let z=0;while(z<s.length&&s[z]===a[0])z++;let n=0n;
for(let i=z;i<s.length;i+=K){const p=s.slice(i,i+K);let c=0n;for(const ch of p){const x=a.indexOf(ch);if(x<0)throw 0;c=c*B+BigInt(x)}n=n*(p.length===K?BK:B**BigInt(p.length))+c}
let h=n===0n?'':n.toString(16);if(h.length%2)h='0'+h;
const o=new Uint8Array(z+h.length/2);for(let i=0;i<h.length/2;i++)o[z+i]=parseInt(h.substr(i*2,2),16);return o}
}};
const C={
b64:{e:e64,d:d64},
b64u:{e:u=>e64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),d:s=>{s=s.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return d64(s)}},
b32:{e:u=>e32(u,A32),d:s=>d32(s,A32)},
b32h:{e:u=>e32(u,A32H),d:s=>d32(s,A32H)},
b16:{e:hx,d:unhx},
b85:{e:e85,d:d85},
b58:big(A58),b62:big(A62),b36:big(A36),
b10:per(10,3),b8:per(8,3),b2:per(2,8)
};
const slow=['b36','b58','b62'];
const sniff=u=>{
const h=hx(u.subarray(0,12));
if(h.startsWith('89504e47'))return'image/png';
if(h.startsWith('ffd8ff'))return'image/jpeg';
if(h.startsWith('47494638'))return'image/gif';
if(h.startsWith('52494646')&&h.slice(16,24)==='57454250')return'image/webp';
if(h.startsWith('424d'))return'image/bmp';
if(h.startsWith('00000100'))return'image/x-icon';
if(h.slice(8,16)==='66747970'&&h.slice(16,24)==='61766966')return'image/avif';
if(/^(<\?xml|<svg)/i.test(td.decode(u.subarray(0,200)).trimStart()))return'image/svg+xml';
return'';
};
const clearImg=()=>{if(url)URL.revokeObjectURL(url);url='';img.removeAttribute('src')};
const render=()=>{
const ie=k==='i'&&d==='e',id=k==='i'&&d==='d';
$('#tf').hidden=ie;$('#ff').hidden=!ie;
$('#uri').hidden=!(ie&&base.value==='b64');
$('#l1').textContent=k==='t'?(d==='e'?'Text to encode':'Encoded text to decode'):'Encoded image text';
inp.placeholder=k==='t'?(d==='e'?'Type or paste your text':'Paste the encoded text'):'Paste the encoded image text or a data URI';
$('#gl').textContent=d==='e'?'Encode':'Decode';
res.hidden=true;out.hidden=id;pv.hidden=true;$('#sw').hidden=id;out.value='';clearImg();say('');
};
const wire=(id,fn)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.addEventListener('click',()=>{
document.querySelectorAll('#'+id+' button').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',on)});
fn(b.dataset.v);
}));
wire('kind',v=>{k=v;render()});
wire('dir',v=>{d=v;render()});
base.addEventListener('change',render);
const setFile=f=>{
if(!f)return;
if(!f.type.startsWith('image/')){say('That file is not an image.',1);return}
if(f.size>5242880){say('Image is too large. The limit is 5 MB.',1);return}
file=f;
if(th.src)URL.revokeObjectURL(th.src);
th.src=URL.createObjectURL(f);th.hidden=false;
fname.textContent=f.name+' ('+(f.size/1024).toFixed(1)+' KB)';
say('');
};
$('#file').addEventListener('change',e=>setFile(e.target.files[0]));
const drop=$('#drop');
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
const run=async()=>{
if(go.disabled)return;
const name=base.selectedOptions[0].textContent,c=C[base.value];
go.disabled=true;go.classList.add('busy');say('Working');
await new Promise(r=>setTimeout(r,40));
try{
res.hidden=true;pv.hidden=true;clearImg();
if(d==='e'){
let u;
if(k==='t'){if(!inp.value)throw{m:'Enter some text first.'};u=te.encode(inp.value)}
else{if(!file)throw{m:'Choose an image first.'};u=new Uint8Array(await file.arrayBuffer())}
if(slow.includes(base.value)&&u.length>150000)throw{m:'This is too large for '+name+'. Use a smaller input or another base.'};
let s=c.e(u);
if(k==='i'&&base.value==='b64'&&$('#duri').checked)s='data:'+(file.type||'application/octet-stream')+';base64,'+s;
out.value=s;res.hidden=false;say('Encoded as '+name+'.');
}else{
let s=inp.value;
if(!s.trim())throw{m:'Enter the encoded text first.'};
if(k==='i')s=s.replace(/^\s*data:[^,]*,/i,'');
if(slow.includes(base.value)&&s.length>205000)throw{m:'This is too large for '+name+'. Use a smaller input or another base.'};
const u=c.d(s);
if(k==='t'){
try{out.value=tf8.decode(u)}catch(e){throw{m:'Decoded data is not valid text.'}}
res.hidden=false;say('Decoded from '+name+'.');
}else{
const t=sniff(u);
if(!t)throw{m:'Decoded data is not a supported image.'};
url=URL.createObjectURL(new Blob([u],{type:t}));
img.onload=()=>{pv.hidden=false;res.hidden=false;say('Decoded from '+name+'.')};
img.onerror=()=>{res.hidden=true;say('Decoded data is not a valid image.',1)};
img.src=url;
}
}
}catch(e){
res.hidden=true;
say(e&&e.m?e.m:'Invalid input for '+name+'.',1);
}
go.disabled=false;go.classList.remove('busy');
};
go.addEventListener('click',run);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run()}});
$('#cp').addEventListener('click',async()=>{
try{await navigator.clipboard.writeText(out.value)}catch(e){out.select();document.execCommand('copy')}
say('Copied.');
});
$('#sw').addEventListener('click',()=>{
const v=out.value;
document.querySelector('#dir button[data-v="'+(d==='e'?'d':'e')+'"]').click();
inp.value=v;
});
$('#clr').addEventListener('click',()=>{inp.value='';out.value='';file=null;th.hidden=true;fname.textContent='Choose or drop an image';$('#file').value='';res.hidden=true;pv.hidden=true;clearImg();say('')});
})();
</script>
</body>
</html>
